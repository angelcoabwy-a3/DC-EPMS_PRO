═════════════════════════════════════════════════════════════════════════
  Site Topology View — Sprint S1b
  
  HOW TO INTEGRATE INTO frontend/index.html:
  
  1. SIDEBAR ENTRY: Add this line to the existing nav menu, between the
     'Co-Pilot' entry and any 'Settings' entry:
     
       <li class="nav-item" data-view="site-topology">
         <span class="nav-icon">▦</span>
         <span class="nav-label">Site Topology</span>
       </li>
  
  2. VIEW PANEL: Copy the <section id="view-site-topology"> block below
     and paste it into the <main> area of index.html, alongside the
     other <section id="view-..."> panels.
  
  3. STYLES: Append the contents of the <style> block to assets/app.css
     (or keep inline if your existing setup uses inline styles).
  
  4. SCRIPT: Append the contents of the <script> block to assets/app.js,
     and call SiteTopology.init() from your existing view-router when
     the user navigates to site-topology.
  
  No external dependencies — uses fetch() and vanilla DOM APIs only.
  Compatible with the existing v8.1.0 cyan/anthracite/graphite theme.
═════════════════════════════════════════════════════════════════════════

<!-- ════════════════════════ HTML PANEL ════════════════════════ -->
<section id="view-site-topology" class="view" hidden>
  <header class="view-header">
    <h1>Site Topology</h1>
    <div class="view-subtitle" id="site-topology-subtitle">A3-Alpha Toronto Area</div>
  </header>

  <div class="site-topology-layout">
    <!-- LEFT: Tree explorer -->
    <aside class="site-tree-panel">
      <div class="tree-header">
        <span class="tree-title">Hierarchy</span>
        <button class="btn-tiny" id="site-tree-refresh" title="Reload">↻</button>
      </div>
      <div class="site-tree" id="site-tree-root">
        <div class="tree-loading">Loading site model…</div>
      </div>
    </aside>

    <!-- RIGHT: Detail panel -->
    <section class="site-detail-panel">
      <div class="detail-empty" id="site-detail-empty">
        Select a component on the left to view its location, power chain,
        and LOTO impact.
      </div>

      <div class="detail-content" id="site-detail-content" hidden>
        <header class="detail-header">
          <h2 id="detail-title">—</h2>
          <div class="detail-breadcrumb" id="detail-breadcrumb"></div>
        </header>

        <div class="detail-tabs">
          <button class="detail-tab active" data-tab="overview">Overview</button>
          <button class="detail-tab" data-tab="power">Power Chain</button>
          <button class="detail-tab" data-tab="loto">LOTO Impact</button>
        </div>

        <div class="detail-tab-content" id="tab-overview">
          <dl class="detail-grid" id="detail-overview-fields"></dl>
        </div>

        <div class="detail-tab-content" id="tab-power" hidden>
          <div id="detail-power-content"></div>
        </div>

        <div class="detail-tab-content" id="tab-loto" hidden>
          <div id="detail-loto-content"></div>
        </div>
      </div>
    </section>
  </div>
</section>

<!-- ════════════════════════ JAVASCRIPT ════════════════════════ -->
<script>
// SiteTopology module — Sprint S1b
const SiteTopology = (() => {
  const API_BASE = "/api/site";
  let selectedComponentId = null;
  let _initialized = false;

  // ── HTTP helpers ─────────────────────────────────────────────────────
  async function api(path) {
    const r = await fetch(`${API_BASE}${path}`);
    if (!r.ok) {
      const text = await r.text().catch(() => "");
      throw new Error(`API ${path} -> ${r.status}: ${text}`);
    }
    return r.json();
  }

  // ── DOM helpers ──────────────────────────────────────────────────────
  function $(id) { return document.getElementById(id); }
  function el(tag, props = {}, children = []) {
    const e = document.createElement(tag);
    Object.assign(e, props);
    if (props.className) e.className = props.className;
    children.forEach(c => {
      if (typeof c === "string") e.appendChild(document.createTextNode(c));
      else if (c) e.appendChild(c);
    });
    return e;
  }
  function clear(node) { while (node.firstChild) node.removeChild(node.firstChild); }

  // ── Tree rendering ───────────────────────────────────────────────────
  async function renderTree() {
    const root = $("site-tree-root");
    clear(root);
    root.appendChild(el("div", { className: "tree-loading" }, ["Loading…"]));
    try {
      const meta = await api("/metadata");
      $("site-topology-subtitle").textContent =
        `${meta.name} · ${meta.classification} · ${meta.it_capacity_mw} MW IT`;

      const { buildings } = await api("/buildings");
      clear(root);
      for (const b of buildings) {
        root.appendChild(buildingNode(b));
      }
    } catch (e) {
      clear(root);
      root.appendChild(el("div", { className: "tree-loading" },
        [`Error: ${e.message}`]));
    }
  }

  function buildingNode(b) {
    const wrap = el("div", { className: "tree-node" });
    const row = el("div", { className: "tree-row" });
    const toggle = el("span", { className: "tree-toggle" }, ["▸"]);
    row.appendChild(toggle);
    row.appendChild(el("span", { className: "tree-icon" }, ["▦"]));
    row.appendChild(el("span", { className: "tree-label" }, [b.display]));
    row.appendChild(el("span", { className: "tree-count" }, [`${b.room_count} rooms`]));
    wrap.appendChild(row);

    const children = el("div", { className: "tree-children" });
    children.style.display = "none";
    wrap.appendChild(children);

    let loaded = false;
    row.addEventListener("click", async (e) => {
      e.stopPropagation();
      const expanded = children.style.display === "block";
      children.style.display = expanded ? "none" : "block";
      row.classList.toggle("expanded", !expanded);
      toggle.textContent = expanded ? "▸" : "▾";
      if (!loaded && !expanded) {
        loaded = true;
        await loadBuildingTree(b.id, children);
      }
    });
    return wrap;
  }

  async function loadBuildingTree(buildingId, container) {
    container.appendChild(el("div", { className: "tree-loading" }, ["Loading…"]));
    try {
      const data = await api(`/tree/${buildingId}`);
      clear(container);
      for (const room of data.rooms) {
        container.appendChild(roomNode(room));
      }
    } catch (e) {
      clear(container);
      container.appendChild(el("div", { className: "tree-loading" },
        [`Error: ${e.message}`]));
    }
  }

  function roomNode(room) {
    const wrap = el("div", { className: "tree-node" });
    const row = el("div", { className: "tree-row" });
    const toggle = el("span", { className: "tree-toggle" }, ["▸"]);
    row.appendChild(toggle);
    const iconMap = {
      data_hall: "▥", electrical_room: "⚡", mechanical_room: "❄",
      mechanical_plant: "❄", emergency_power: "⚡", utility_intake: "⚡",
      fuel_depot: "⛽", control_room: "▣",
    };
    row.appendChild(el("span", { className: "tree-icon" },
      [iconMap[room.type] || "·"]));
    row.appendChild(el("span", { className: "tree-label" }, [room.display]));
    const count = (room.components.length || 0) + (room.rows.length || 0);
    row.appendChild(el("span", { className: "tree-count" },
      [count ? `${count} items` : ""]));
    wrap.appendChild(row);

    const children = el("div", { className: "tree-children" });
    children.style.display = "none";
    wrap.appendChild(children);

    // Add rows (with their racks)
    for (const r of (room.rows || [])) {
      children.appendChild(rowNode(r));
    }
    // Add direct components
    for (const compId of (room.components || [])) {
      children.appendChild(componentLeaf(compId));
    }

    row.addEventListener("click", (e) => {
      e.stopPropagation();
      const expanded = children.style.display === "block";
      children.style.display = expanded ? "none" : "block";
      row.classList.toggle("expanded", !expanded);
      toggle.textContent = expanded ? "▸" : "▾";
    });
    return wrap;
  }

  function rowNode(rowData) {
    const wrap = el("div", { className: "tree-node" });
    const row = el("div", { className: "tree-row" });
    const toggle = el("span", { className: "tree-toggle" }, ["▸"]);
    row.appendChild(toggle);
    row.appendChild(el("span", { className: "tree-icon" }, ["≡"]));
    row.appendChild(el("span", { className: "tree-label" }, [rowData.display]));
    row.appendChild(el("span", { className: "tree-count" },
      [`${rowData.racks.length} racks`]));
    wrap.appendChild(row);

    const children = el("div", { className: "tree-children" });
    children.style.display = "none";
    wrap.appendChild(children);

    for (const rackId of rowData.racks) {
      children.appendChild(componentLeaf(rackId));
    }

    row.addEventListener("click", (e) => {
      e.stopPropagation();
      const expanded = children.style.display === "block";
      children.style.display = expanded ? "none" : "block";
      row.classList.toggle("expanded", !expanded);
      toggle.textContent = expanded ? "▸" : "▾";
    });
    return wrap;
  }

  function componentLeaf(canonicalId) {
    const leaf = el("div", { className: "tree-component" }, [canonicalId]);
    leaf.dataset.componentId = canonicalId;
    leaf.addEventListener("click", (e) => {
      e.stopPropagation();
      selectComponent(canonicalId);
    });
    return leaf;
  }

  // ── Detail panel ─────────────────────────────────────────────────────
  async function selectComponent(canonicalId) {
    selectedComponentId = canonicalId;
    document.querySelectorAll(".tree-component.selected")
      .forEach(n => n.classList.remove("selected"));
    document
      .querySelectorAll(`.tree-component[data-component-id="${canonicalId}"]`)
      .forEach(n => n.classList.add("selected"));

    $("site-detail-empty").hidden = true;
    $("site-detail-content").hidden = false;

    try {
      const comp = await api(`/components/${canonicalId}`);
      $("detail-title").textContent = comp.display;
      renderBreadcrumb(comp.location);
      renderOverview(comp);

      // Lazy-load other tabs on demand
      $("tab-power").innerHTML =
        '<div id="detail-power-content"><em style="color:#6a7a8b">Click "Power Chain" to load…</em></div>';
      $("tab-loto").innerHTML =
        '<div id="detail-loto-content"><em style="color:#6a7a8b">Click "LOTO Impact" to load…</em></div>';
    } catch (e) {
      $("detail-title").textContent = "Error";
      $("detail-overview-fields").textContent = e.message;
    }
  }

  function renderBreadcrumb(location) {
    const bc = $("detail-breadcrumb");
    clear(bc);
    location.components.forEach((c, i) => {
      if (i > 0) {
        bc.appendChild(el("span", { className: "crumb-sep" }, ["/"]));
      }
      bc.appendChild(el("span", {}, [c.display]));
    });
  }

  function renderOverview(comp) {
    const grid = $("detail-overview-fields");
    clear(grid);
    const fields = [
      ["Canonical ID", comp.canonical_id],
      ["Display", comp.display],
      ["Type", comp.type],
      ["Location", comp.location.path],
    ];
    // Add metadata fields
    Object.entries(comp).forEach(([k, v]) => {
      if (["canonical_id", "display", "type", "location"].includes(k)) return;
      if (v === null || v === undefined) return;
      if (typeof v === "object") return;
      const label = k.replace(/_/g, " ").replace(/\b\w/g, l => l.toUpperCase());
      fields.push([label, String(v)]);
    });
    fields.forEach(([k, v]) => {
      grid.appendChild(el("dt", {}, [k]));
      grid.appendChild(el("dd", {}, [v]));
    });
  }

  async function loadPowerTab() {
    if (!selectedComponentId) return;
    const target = $("detail-power-content");
    target.innerHTML = '<em style="color:#6a7a8b">Loading…</em>';
    try {
      const data = await api(`/power-chain/${selectedComponentId}`);
      target.innerHTML = "";

      const summary = el("div", { className: "power-summary" });
      if (data.feed_count >= 2) {
        summary.appendChild(el("span", { className: "badge-2n" }, ["2N"]));
        summary.appendChild(el("span", {},
          [`Component has ${data.feed_count} redundant feed paths.`]));
      } else if (data.feed_count === 1) {
        summary.appendChild(el("span", {},
          [`Component has 1 feed path (single-corded).`]));
      } else {
        summary.appendChild(el("span", {}, ["No upstream feeds."]));
      }
      target.appendChild(summary);

      data.feeds.forEach(feed => {
        const block = el("div", {
          className: `power-feed-block ${feed.group}`
        });
        block.appendChild(el("div", { className: "feed-group-title" },
          [feed.group.toUpperCase().replace("_", " ")]));

        const rootsRow = el("div", { className: "feed-roots" });
        rootsRow.appendChild(document.createTextNode("Roots: "));
        feed.roots.forEach(r => {
          rootsRow.appendChild(el("span", { className: "root-pill" }, [r]));
        });
        block.appendChild(rootsRow);

        const pathRow = el("div", { className: "feed-path" });
        feed.representative_path.forEach((node, i) => {
          if (i > 0) pathRow.appendChild(el("span", { className: "arrow" }, ["→"]));
          pathRow.appendChild(document.createTextNode(node));
        });
        block.appendChild(pathRow);
        target.appendChild(block);
      });
    } catch (e) {
      target.innerHTML = `<div style="color:#ff5050">Error: ${e.message}</div>`;
    }
  }

  async function loadLotoTab() {
    if (!selectedComponentId) return;
    const target = $("detail-loto-content");
    target.innerHTML = '<em style="color:#6a7a8b">Loading…</em>';
    try {
      const data = await api(`/loto-impact/${selectedComponentId}`);
      target.innerHTML = "";

      const banner = el("div", {
        className: "loto-banner " +
          (data.racks_losing_all_redundancy.length === 0 ? "safe" : "unsafe")
      });
      banner.textContent = data.racks_losing_all_redundancy.length === 0
        ? `✓ Safe LOTO — all affected racks retain Path B redundancy.`
        : `⚠ Risk — ${data.racks_losing_all_redundancy.length} racks would lose all redundancy.`;
      target.appendChild(banner);

      const stats = el("div", { className: "loto-stats" });
      const mkStat = (label, value, modifier) => {
        const s = el("div", { className: "loto-stat" });
        s.appendChild(el("div", {
          className: `loto-stat-value ${modifier || ""}`
        }, [String(value)]));
        s.appendChild(el("div", { className: "loto-stat-label" }, [label]));
        return s;
      };
      stats.appendChild(mkStat("Downstream Components", data.downstream_count));
      stats.appendChild(mkStat("Racks Affected", data.racks_affected.length));
      stats.appendChild(mkStat(
        "Racks At Outage Risk",
        data.racks_losing_all_redundancy.length,
        data.racks_losing_all_redundancy.length === 0 ? "ok" : "danger",
      ));
      target.appendChild(stats);

      if (data.racks_affected.length) {
        target.appendChild(el("h3",
          { style: "font-size:13px;color:#8a9aab;margin:16px 0 8px;text-transform:uppercase;letter-spacing:0.04em;" },
          ["Per-Rack Redundancy"]));
        const list = el("div", { className: "loto-rack-list" });
        data.racks_affected.forEach(r => {
          const row = el("div", { className: "loto-rack-row" });
          row.appendChild(el("span", {}, [r.rack]));
          row.appendChild(el("span", {
            className: "rack-status " + (r.still_has_redundancy ? "safe" : "danger")
          }, [r.still_has_redundancy ?
                `${r.remaining_paths}/${r.total_paths} paths OK` :
                `OUTAGE RISK`]));
          list.appendChild(row);
        });
        target.appendChild(list);
      }
    } catch (e) {
      target.innerHTML = `<div style="color:#ff5050">Error: ${e.message}</div>`;
    }
  }

  // ── Tab switching ────────────────────────────────────────────────────
  function bindTabs() {
    document.querySelectorAll(".detail-tab").forEach(btn => {
      btn.addEventListener("click", () => {
        const tab = btn.dataset.tab;
        document.querySelectorAll(".detail-tab")
          .forEach(b => b.classList.toggle("active", b === btn));
        document.querySelectorAll(".detail-tab-content")
          .forEach(c => c.hidden = c.id !== `tab-${tab}`);
        if (tab === "power") loadPowerTab();
        if (tab === "loto") loadLotoTab();
      });
    });
  }

  // ── Public init ──────────────────────────────────────────────────────
  function init() {
    if (_initialized) {
      // Already initialized — just refresh data
      renderTree();
      return;
    }
    _initialized = true;
    bindTabs();
    document.getElementById("site-tree-refresh")
      .addEventListener("click", renderTree);
    renderTree();
  }

  return { init };
})();

// Auto-init when navigating to this view via the existing view router.
// If your view router has a hook like `onViewChange("site-topology", ...)`,
// call SiteTopology.init() from there. As a fallback, listen to clicks on
// the nav item:
document.addEventListener("DOMContentLoaded", () => {
  const navItem = document.querySelector('[data-view="site-topology"]');
  if (navItem) {
    navItem.addEventListener("click", () => {
      // Slight delay to allow existing view router to swap panels
      setTimeout(() => SiteTopology.init(), 50);
    });
  }
});
</script>
