[package]
name = "dc-epms-gateway"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
nalgebra = "0.35.0"
prost = "0.14.4"
prost-types = "0.14.4"
reqwest = { version = "0.13.4", default-features = false }
rmodbus = "0.12.2"
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.52.3", features = ["full"] }
toml = "1.1.2"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[build-dependencies]
prost-build = "0.14.4"
protoc-bin-vendored = "3.2.0"
