# ════════════════════════════════════════════════════════════════════════
#  Per-channel Kalman + Send-on-Delta calibration
#
#  Sprint 5 Bite C3 — Decision 4-B closure (per-channel YAML config).
#  Replaces hardcoded R/Q overrides in backend/telemetry_pipeline.py and
#  the calibration logic that was previously embedded across
#  backend/telemetry_simulator.PHASE1_BASELINES (for std/R derivation)
#  and backend/telemetry_pipeline._PROCESS_NOISE_Q (for Q).
#
#  Loader: backend/telemetry_pipeline.TelemetryChannelConfig.load(...)
#  YAML root keys:
#    defaults.{R, Q, F, sod_threshold_k}
#    channels.<metric>.{R, Q, F?, rationale}
#
#  Channels not listed here fall back to defaults. The simulator metric
#  name (e.g. "gpu_Tj_c") is the key, NOT the scoped channel id
#  ("rack_a_01_05:gpu_Tj_c") — calibration is per metric type, shared
#  across all components emitting that metric.
#
#  R = measurement noise variance (std^2) for the Kalman observation model.
#  Q = process noise variance (state model uncertainty per timestep).
#  F = state transition coefficient. 1.0 = random walk (track baseline).
#      cyber_physical_tools default exp(-dt/60) was for thermal decay
#      models, NOT stationary signals — fixed at 1.0 across the board.
#
#  sod_threshold_k:
#    Currently informational only — cyber_physical_tools.py applies its
#    module-level constant SEND_ON_DELTA_K=0.5 globally to all channels.
#    Per-channel SoD enforcement deferred to DC-EPMS-038 (V10), since
#    it would require either monkey-patching the orphan or duplicating
#    the SoD+Kalman pipeline locally.
# ════════════════════════════════════════════════════════════════════════

defaults:
  R: 0.0025      # PT100 noise variance fallback (0.05 K)^2
  Q: 0.0001      # slow thermal mass default
  F: 1.0         # random-walk tracker for stationary signals
  sod_threshold_k: 0.5

channels:

  # ── IT thermal ────────────────────────────────────────────────────
  rack_inlet_T_c:
    R: 0.16
    Q: 0.001
    sod_threshold_k: 0.5
    rationale: "PT100 in stable enclosure, ASHRAE A2 envelope (10-35 C). std=0.4 K."

  gpu_Tj_c:
    R: 16.0
    Q: 0.01
    sod_threshold_k: 1.0
    rationale: "Thermistor at GPU silicon, NVIDIA GB200 NVL72 thermal envelope 60-75 C nominal. Workload-driven transients. std=4.0 K."

  dlc_supply_T_c:
    R: 0.09
    Q: 0.0001
    sod_threshold_k: 0.3
    rationale: "Pump-stabilized direct-liquid-cooling supply loop, std=0.3 K. Tighter envelope than rack inlet (closed loop)."

  dlc_return_T_c:
    R: 0.25
    Q: 0.0001
    sod_threshold_k: 0.5
    rationale: "DLC return temp, std=0.5 K. Larger variance than supply due to load-coupling."

  # ── Electrical (Phase 1: 480 VAC trifásico) ───────────────────────
  voltage_v_phase_ab:
    R: 5.76
    Q: 0.001
    sod_threshold_k: 1.0
    rationale: "Schneider Galaxy VX UPS A-B phase voltage, 0.5% regulation. Baseline 480 V, std=2.4 V."

  voltage_v_phase_bc:
    R: 5.76
    Q: 0.001
    sod_threshold_k: 1.0
    rationale: "B-C phase voltage, same regulation as A-B."

  voltage_v_phase_ca:
    R: 5.76
    Q: 0.001
    sod_threshold_k: 1.0
    rationale: "C-A phase voltage, same regulation as A-B."

  ups_soc_pct:
    R: 0.25
    Q: 0.001
    sod_threshold_k: 0.5
    rationale: "UPS battery state of charge (Schneider Galaxy VX). Baseline 98.5%, std=0.5%."

  batt_runtime_min:
    R: 0.09
    Q: 0.001
    sod_threshold_k: 0.5
    rationale: "Battery runtime estimate at full load, baseline 15 min, std=0.3 min."

  # ── Mechanical (chiller, CDU, pump) ───────────────────────────────
  chiller_LWT_c:
    R: 0.0225
    Q: 0.0001
    sod_threshold_k: 0.2
    rationale: "York YZ chiller leaving water temp setpoint band 6.7-7.2 C. std=0.15 K. Tight control loop."

  chiller_cop:
    R: 0.04
    Q: 0.0001
    sod_threshold_k: 0.2
    rationale: "York YZ chiller coefficient of performance, baseline 5.8, std=0.2."

  cdu_primary_supply_T_c:
    R: 0.0625
    Q: 0.0001
    sod_threshold_k: 0.3
    rationale: "CDU dual-loop — BPHE facility-side (primary / district CHW) supply temp. Baseline 30.5 C, std=0.25 K."

  cdu_secondary_supply_T_c:
    R: 0.0484
    Q: 0.0001
    sod_threshold_k: 0.3
    rationale: "CDU dual-loop — BPHE technology-side (secondary / clean coolant) supply temp to IT racks. Baseline 32.0 C, std=0.22 K."

  cdu_filter_dp_kpa:
    R: 16.0
    Q: 0.001
    sod_threshold_k: 3.0
    rationale: "CDU coolant filter differential pressure. Nominal 10-35 kPa, baseline 22, std=4. Critical at 50 kPa (clogged element)."

  cdu_flow_lpm:
    R: 25.0
    Q: 0.001
    sod_threshold_k: 5.0
    rationale: "CDU coolant flow, baseline 180 LPM, std=5 LPM."

  pump_NPSH_margin_m:
    R: 0.0225
    Q: 0.0001
    sod_threshold_k: 0.2
    rationale: "Chilled-water pump net positive suction head margin, baseline 3.5 m, std=0.15 m. Cavitation risk if margin drops below ~1 m."

  pump_flow_gpm:
    R: 2500.0
    Q: 0.001
    sod_threshold_k: 50.0
    rationale: "Pump flow rate, baseline 4500 GPM, std=50 GPM."

  # ── Heat rejection ────────────────────────────────────────────────
  ecwt_c:
    R: 0.25
    Q: 0.0001
    sod_threshold_k: 0.5
    rationale: "Entering condenser water temp (cooling tower outlet to chiller). Baseline 24 C, std=0.5 K. Tracks outdoor wet bulb with offset."

  outdoor_wet_bulb_c:
    R: 2.25
    Q: 0.01
    sod_threshold_k: 1.0
    rationale: "Outdoor wet-bulb temperature, weather-driven. Baseline 15 C, std=1.5 K. Larger Q reflects rapid weather swings."

  # ── Generator bus synchronization (multi-region: 480V/60Hz + 416V/50Hz) ──
  genset_voltage_v:
    R: 5.76
    Q: 0.001
    sod_threshold_k: 1.0
    rationale: "Genset terminal voltage at the sync panel. Toronto 480 V band (std=2.4); EMEA 416 V band (std=2.1) shares this calibration."

  genset_freq_hz:
    R: 0.0004
    Q: 0.00001
    sod_threshold_k: 0.05
    rationale: "Genset frequency at the sync panel. Toronto 60.00 Hz / EMEA 50.00 Hz, std=0.02 Hz. Tight sync gate."

  genset_phase_angle_deg:
    R: 0.16
    Q: 0.001
    sod_threshold_k: 0.5
    rationale: "Phase-angle deviation vs the main bus. Nominal 0 deg, std=0.4. Desynchronization fault when sustained > 5 deg."

  phase_sequence_match:
    R: 0.0004
    Q: 0.00001
    sod_threshold_k: 0.5
    rationale: "Phase-sequence (rotation) match status bit. 1.0 = matched (A-B-C / R-Y-B), 0.0 = reversed. std=0.02."

  genset_breaker_status:
    R: 0.0004
    Q: 0.00001
    sod_threshold_k: 0.5
    rationale: "Generator SSCB status bit. 1.0 = closed/synced to main bus, 0.0 = tripped/open. std=0.02."

  # ── Utility intakes (Phase 1 27.5 kV + Phase 2 35 kV DESIGN) ──────
  utility_voltage_kv:
    R: 0.0256
    Q: 0.0001
    sod_threshold_k: 0.3
    rationale: "MV utility intake line voltage, metadata-keyed baseline (27.5 kV Phase 1 / 35 kV Phase 2 DESIGN). 0.5% regulation -> std 0.14-0.18 kV; R from the midpoint (0.16 kV)^2."

  # ── Phase 2 Building D — DESIGN-sim channels (MVP S2) ─────────────
  # These channels are design-point synthetics for the not-yet-built
  # Building D chain. Vocabulary fence S-VOCAB-01: voltage_v_dc_bus is
  # the DC metric — it never carries a phase suffix.
  rect_load_mw:
    R: 1.44
    Q: 0.01
    sod_threshold_k: 1.0
    rationale: "DESIGN-sim. MV rectifier throughput at the 50 MW IT design point. std=1.2 MW workload swing."

  rect_efficiency_ratio:
    R: 0.000004
    Q: 0.00001
    sod_threshold_k: 0.2
    rationale: "DESIGN-sim. Solid-state MV rectifier efficiency, baseline 0.985, std=0.002."

  sscb_junction_T_c:
    R: 1.44
    Q: 0.001
    sod_threshold_k: 1.0
    rationale: "DESIGN-sim. SSCB semiconductor junction temperature (IEC 60947-2 class device), baseline 55 C, std=1.2 K."

  voltage_v_dc_bus:
    R: 2.56
    Q: 0.001
    sod_threshold_k: 1.0
    rationale: "DESIGN-sim. 800 VDC unipolar TN-S main bus, 0.2% ripple class -> std=1.6 V. The schema-fenced DC metric (no phases on a DC bus)."

  bess_soc_pct:
    R: 0.64
    Q: 0.0005
    sod_threshold_k: 0.5
    rationale: "DESIGN-sim. BESS 2.5 MWh state of charge, baseline 85%, std=0.8%."

  bess_dc_current_a:
    R: 144.0
    Q: 0.05
    sod_threshold_k: 10.0
    rationale: "DESIGN-sim. BESS DC current, swings around 0 A (charge/discharge), std=12 A."

  farm_units_online_count:
    R: 0.0025
    Q: 0.00001
    sod_threshold_k: 0.5
    rationale: "DESIGN-sim. Genset farm units online (aggregate). Standby baseline 0 — the farm runs only on utility loss. std=0.05."

  farm_bus_voltage_kv:
    R: 0.0004
    Q: 0.00001
    sod_threshold_k: 0.3
    rationale: "DESIGN-sim. 13.8 kV paralleling bus voltage. Dead bus (0 kV) in standby per dead-bus black-start doctrine. std=0.02 kV."
